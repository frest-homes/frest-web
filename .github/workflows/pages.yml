name: Build and deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow jinja2
      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: |
            site/img
            assets/manifest.json
          key: img-${{ hashFiles('assets/src/**', 'images.py', 'focal.py') }}
      - run: python3 images.py
      - run: python3 focal.py
      - run: python3 build.py --base "${BASE}" --canonical "${CANONICAL}"
        env:
          BASE: ${{ vars.SITE_BASE || '/frest-web/' }}
          CANONICAL: ${{ vars.SITE_CANONICAL || 'https://frest-homes.github.io' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
